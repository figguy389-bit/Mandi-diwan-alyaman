<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مندي ديوان اليمن</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c08;--bg2:#1a160d;--card:#17130b;--gold:#d9ae4c;--gold2:#f3d98b;--tx:#f4ead2;--mut:#a99a78;--line:#3a3017;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0c08}}
:root[data-theme="dark"]{--bg:#0e0c08}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Tajawal,Tahoma,sans-serif;max-width:640px;margin:auto;min-height:100vh}
button,input{font-family:inherit}
.rq{font-family:'Aref Ruqaa',serif;font-weight:700;background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,#a37a26);-webkit-background-clip:text;background-clip:text;color:transparent}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg2)}
.pill{border:1px solid var(--gold);color:var(--gold2);background:none;border-radius:999px;padding:8px 16px;font-size:16px;display:flex;gap:8px;align-items:center;cursor:pointer}
.logo{width:62px;height:62px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
.badge{background:var(--gold);color:#000;border-radius:50%;min-width:20px;height:20px;font-size:12px;display:inline-grid;place-items:center;font-weight:700}
.slider{margin:14px 16px;border-radius:22px;overflow:hidden;position:relative;aspect-ratio:16/10;background:#000}
.slider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.slider img.on{opacity:1}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:8px;height:8px;border-radius:9px;background:#fff7;transition:.3s}.dots i.on{width:28px;background:var(--gold)}
hr{border:0;border-top:1px solid var(--line);margin:0 16px}
.cats{display:flex;gap:16px;overflow-x:auto;padding:16px;scrollbar-width:none}
.cat{flex:0 0 96px;text-align:center;cursor:pointer;position:relative}
.cat .ci{width:96px;height:96px;border-radius:26px;background:radial-gradient(circle at 30% 20%,#3a2d12,#15110a);display:grid;place-items:center;font-size:44px;overflow:hidden;border:2px solid transparent}
.cat img{width:100%;height:100%;object-fit:cover}
.cat span{display:block;margin-top:8px;font-size:17px;color:var(--tx)}
.cat.on span{color:var(--gold)}.cat.on .ci{border-color:var(--gold)}
.tools{display:flex;gap:10px;padding:14px 20px;align-items:center}
.vb{width:44px;height:40px;border:1.5px solid var(--mut);border-radius:8px;background:none;color:var(--mut);display:grid;place-items:center;cursor:pointer}
.vb.on{border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px 10px}
.grid.list{grid-template-columns:1fr}
.it{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:1/0.92;background:radial-gradient(circle at 30% 20%,#3a2d12,#15110a);display:grid;place-items:center;font-size:68px}
.list .it{aspect-ratio:auto;height:110px;font-size:44px;border-radius:18px}
.it>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cap{position:absolute;bottom:0;left:0;right:0;padding:12px 14px;display:flex;justify-content:space-between;gap:6px;align-items:center;background:rgba(20,15,5,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:17px}
.cap b{font-weight:700}.cap small{color:var(--gold2);font-size:15px;white-space:nowrap}
.add{position:absolute;top:10px;left:10px;width:44px;height:44px;border-radius:50%;border:0;background:#f1ecd9d9;color:#222;font-size:30px;line-height:1;cursor:pointer;display:grid;place-items:center}
.ed{position:absolute;top:10px;right:10px;border:0;border-radius:999px;background:var(--gold);color:#000;padding:6px 12px;font-size:14px;cursor:pointer}
.foot{margin:20px 16px;padding:18px;border:1px solid var(--line);border-radius:22px;text-align:center;background:var(--bg2)}
.foot a{color:var(--gold2);text-decoration:none}
.ph{display:inline-block;font-size:24px;margin:6px 0;direction:ltr;letter-spacing:1px}
.soc{display:flex;gap:14px;justify-content:center;margin-top:10px}
.soc a{width:48px;height:48px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center}
.soc svg{width:24px;height:24px;fill:var(--gold2)}
.adm{border:1px dashed var(--line);background:none;color:var(--mut);border-radius:12px;padding:8px 14px;margin:0 auto 30px;display:block;cursor:pointer}
.ov{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;display:none}
.ov.on{display:block}
.wel{text-align:center;padding:calc(30px + env(safe-area-inset-top,0px)) 24px 30px;max-width:520px;margin:auto;background:radial-gradient(ellipse at top,#2a200c,transparent 60%)}
.wel .logo{width:170px;height:170px;margin-bottom:12px}
.wel h1{font-size:19px;font-weight:500;margin:6px 0 0}
.wel h2{font-size:52px;margin:0 0 14px;line-height:1.3}
.wel p{margin:10px 0;color:var(--mut);font-size:17px;line-height:1.7}
.link{color:var(--gold2);text-decoration:none;display:inline-block;border-bottom:1px solid var(--gold)}
.go{margin:26px 0 0;font-size:22px;padding:14px 46px;border:0;border-radius:999px;background:linear-gradient(180deg,var(--gold2),#b58a2e);color:#1a1204;font-weight:700;cursor:pointer}
#welcome{background-size:cover;background-position:center}
.wel{background:none;padding:calc(26px + env(safe-area-inset-top,0px)) 20px 34px;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.wel .logo{width:150px;height:150px;border-width:3px;box-shadow:0 0 0 6px #d9ae4c33,0 10px 40px #000a}
.wel h2{font-size:56px;margin:0 0 18px}
.wc{width:100%;border:1px solid var(--gold);border-radius:26px;background:#0e0c08cc;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:4px 16px}
.inf{display:flex;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:17px;line-height:1.6;text-align:right}
.inf:last-child{border:0}.inf>span{font-size:22px}.inf p{margin:0;color:var(--tx);font-size:17px}
#wMap{color:var(--gold2)}
#wPh{direction:ltr;justify-content:center;font-size:24px;color:var(--gold2);letter-spacing:1px}
.wel .go{width:100%;margin-top:20px;border-radius:18px}
.sheet{max-width:520px;margin:auto;padding:20px 18px calc(30px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 14px;font-size:24px;color:var(--gold2);display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;color:var(--tx);font-size:30px;cursor:pointer}
.in{width:100%;padding:13px;margin:6px 0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:17px}
label{color:var(--mut);font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.q{display:flex;gap:10px;align-items:center}.q button{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold2);font-size:20px;cursor:pointer}
.btn{width:100%;padding:14px;border-radius:14px;border:0;background:linear-gradient(180deg,var(--gold2),#b58a2e);color:#1a1204;font-size:19px;font-weight:700;cursor:pointer;margin-top:8px}
.btn.g{background:none;border:1px solid var(--gold);color:var(--gold2)}.btn.r{background:none;border:1px solid #c0584c;color:#e08a80}
.btn:disabled{opacity:.35}
.tot{display:flex;justify-content:space-between;font-size:20px;padding:14px 0;color:var(--gold2)}
.bar{position:sticky;top:0;z-index:5;background:#3a2d12;color:var(--gold2);text-align:center;padding:8px;font-size:15px}
.it{aspect-ratio:auto;display:block;font-size:inherit;background:var(--card);border:1px solid var(--line)}
.im{position:relative;aspect-ratio:1/0.85;display:grid;place-items:center;font-size:68px;overflow:hidden;background:radial-gradient(circle at 30% 20%,#3a2d12,#15110a)}
.im>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cap{position:static;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px 12px}
.list .it{display:flex;height:auto}.list .im{width:130px;flex:none;aspect-ratio:1;font-size:44px}.list .cap{justify-content:center}
body{padding-bottom:90px}
.qb{position:absolute;top:-4px;right:-4px;background:var(--gold);color:#000;font-style:normal;font-size:13px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;font-family:Tajawal,sans-serif}
#fcart{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:auto;z-index:20;justify-content:space-between;align-items:center;padding:14px 18px;border:0;border-radius:18px;background:linear-gradient(180deg,#f3d98b,#b58a2e);color:#1a1204;font-size:17px;font-family:inherit;box-shadow:0 8px 30px #000a;cursor:pointer}
.sub{position:absolute;top:10px;left:66px;width:44px;height:44px;border-radius:50%;border:0;background:#f1ecd9d9;color:#222;font-size:30px;line-height:1;cursor:pointer;place-items:center;display:none}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:30px}
</style>
</head>

function addC(b,id){cart[id]=(cart[id]||0)+1;var e=b.querySelector('em');if(!e){e=document.createElement('em');e.className='qb';b.appendChild(e)}e.textContent=cart[id];var sb=b.parentNode.querySelector('.sub');if(sb)sb.style.display='grid';snd(1);b.animate([{transform:'scale(1)'},{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:350});upd();burst(b);try{navigator.vibrate&&navigator.vibrate(30)}catch(x){}}
function subC(b,id){if(!cart[id])return;cart[id]--;var a=b.parentNode.querySelector('.add'),e=a.querySelector('em');if(cart[id]>0){if(e)e.textContent=cart[id]}else{if(e)e.remove();b.style.display='none'}snd(0);b.animate([{transform:'scale(1)'},{transform:'scale(.75)'},{transform:'scale(1)'}],{duration:300});upd()}
var AC;function snd(up){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();var t=AC.currentTime,seq=up?[[880,0],[1318,.09]]:[[420,0],[260,.1]];seq.forEach(function(n){var o=AC.createOscillator(),g=AC.createGain();o.type=up?'sine':'triangle';o.frequency.value=n[0];g.gain.setValueAtTime(0,t+n[1]);g.gain.linearRampToValueAtTime(.28,t+n[1]+.01);g.gain.exponentialRampToValueAtTime(.001,t+n[1]+.28);o.connect(g);g.connect(AC.destination);o.start(t+n[1]);o.stop(t+n[1]+.3)})}catch(e){}}

function burst(b){var r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,cols=['#f3d98b','#d9ae4c','#ff5d5d','#5dd6ff','#7dff8a','#ff9be8','#ffffff'];
function wave(d,n,dist){setTimeout(function(){for(var i=0;i<n;i++){var p=document.createElement('i'),a=Math.PI*2*i/n+Math.random()*.3,k=dist*(.6+Math.random()*.6),s=5+Math.random()*7,c=cols[i%cols.length];p.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;width:'+s+'px;height:'+s+'px;border-radius:50%;background:'+c+';box-shadow:0 0 10px '+c+';pointer-events:none;z-index:90';document.body.appendChild(p);var dx=Math.cos(a)*k,dy=Math.sin(a)*k;var an=p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) scale(.2)',opacity:0}],{duration:900+Math.random()*400,easing:'cubic-bezier(.1,.7,.3,1)'});an.onfinish=(function(q){return function(){q.remove()}})(p)}},d)}
wave(0,36,150);wave(180,28,230);wave(380,20,300)}

function drawCart(){

$('cartBox').innerHTML=h;if(ids.length){['cn','cp','ca'].forEach(function(i){$(i).value=window['_'+i]||''});chk()}}
function qty(k,d){cart[k]=Math.max(0,(cart[k]||0)+d);drawCart();render()}
function chk(){var ok=['cn','cp','ca'].every(function(i){window['_'+i]=$(i).value;return $(i).value.trim().length>1});var c=$('cs');c.style.opacity=ok?1:.35;c.style.pointerEvents=ok?'auto':'none';if(ok)c.href=wa(orderText());$('cw').style.display=ok?'none':'block'}
function orderText(){
var n=$('cn').value.trim(),p=$('cp').value.trim(),a=$('ca').value.trim();
var t='*طلب جديد - مندي ديوان اليمن*\n\n',tot=0;
Object.keys(cart).forEach(function(k){if(!cart[k])return;var x=S.items.filter(function(i){return i.id==k})[0];if(!x)return;tot+=x.p*cart[k];t+='• '+x.n+' × '+cart[k]+' = '+fm(x.p*cart[k])+'\n'});
t+='\n*المجموع:* '+fm(tot)+'\n\n*الاسم:* '+n+'\n*الهاتف:* '+p+'\n*العنوان:* '+a;

var tmp='';
